<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Headless</title>
    <style>
            body {
                margin: 0 auto;
                padding: 1rem;
                max-width: 50rem;
                font-family: system-ui, sans-serif;
                line-height: 1.5;
            }

            figure {
                margin: 2rem 0;
            }

            figcaption {
                color: #555;
                font-size: .875rem;
            }

            img {
                max-width: 100%;
                height: auto;
            }
    </style>
</head>

<body>
    <h1></h1>
    <p>
        <a href="?raw=1">Allow scripts</a> | <a href="?raw=0">Only iframes</a>
        | <a id="server-rendered" href="/">Server-rendered version</a>
    </p>

    <!-- The headings and embeds are added here by app.js, from the Delivery API -->

    <script type="module" src="app.js"></script>
</body>

</html>
