name: CI

on:
  pull_request:
  push:
    branches: ['v*/dev', 'v*/main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIENT_DIR: src/Novicell.Umbraco.OEmbed/Client
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install client packages
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci

      # The client tests run in a real browser (web-test-runner with Playwright)
      - name: Install the test browser
        working-directory: ${{ env.CLIENT_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Test client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm test

      # Type-checks too, and must run before the .NET build, which packs the output
      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run build

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Novicell.Umbraco.OEmbed --configuration Release --no-build --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
